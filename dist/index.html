<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f4f4f4"><meta name="description" content="记录想法，回顾灵感。本地优先的个人笔记工作台。"><title>Fomo · 笔记</title><link rel="stylesheet" href="style.css"></head>

    <nav class="main-nav" aria-label="笔记导航">
      <div class="nav-all-row"><button data-view="all" class="nav-item active"><span data-icon="notes"></span>全部笔记<span class="nav-count" id="navCount"></span></button><button id="toggleQuickFilters" aria-label="展开笔记类型" aria-expanded="false" data-icon="down"></button></div>

  <main class="main">
    <header class="topbar"><div class="title-row"><button id="mobileMenu" class="mobile-menu" aria-label="展开侧栏" data-icon="menu"></button><h1 id="viewTitle">笔记</h1><button id="refresh" aria-label="刷新笔记" title="刷新笔记" data-icon="refresh"></button><button id="sortButton" aria-label="按创建时间排序" title="按创建时间排序" data-icon="down"></button></div><div class="search-wrap"><span data-icon="search"></span><input id="search" placeholder="搜索笔记" aria-label="搜索笔记"><kbd>Ctrl + K</kbd><button id="clearSearch" aria-label="清空搜索" title="清空搜索" data-icon="close" hidden></button><button id="searchFilter" aria-label="搜索筛选" title="搜索筛选" data-icon="sliders"></button></div></header>
    <div id="searchComposerHint" class="search-composer-hint" hidden><span>正在查找笔记</span><button id="resumeWriting">展开记录</button></div><section class="composer" id="composer"><div class="composer-label"><span><span data-icon="edit"></span>快速记录</span><kbd>Ctrl ↵ 保存</kbd></div><div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="记录想法" data-placeholder="现在的想法是..."></div><div id="reflectionBanner" class="reflection-banner" hidden></div><div id="attachments" class="attachments"></div><div id="formatPopover" class="format-popover" role="toolbar" aria-label="文字格式" hidden><button data-format="bold" title="加粗" aria-label="加粗"><b>B</b></button><button data-format="underline" title="下划线（Ctrl + U）" aria-label="下划线"><u>U</u></button><button data-format="highlight" title="高亮（Ctrl + Shift + H）" aria-label="高亮">H</button></div><div id="selectionToolbar" class="selection-toolbar" role="toolbar" aria-label="选中文字格式" hidden><button data-format="bold" title="加粗" aria-label="加粗" data-icon="bold"></button><button data-format="underline" title="下划线" aria-label="下划线" data-icon="underline"></button><button data-format="highlight" title="高亮" aria-label="高亮" data-icon="highlight"></button><button data-format="list" title="无序列表" aria-label="无序列表" data-icon="list"></button><button data-format="number" title="有序列表" aria-label="有序列表" data-icon="ordered"></button><button data-action="tag" title="插入标签" aria-label="插入标签" data-icon="hash"></button><button data-action="image" title="添加图片" aria-label="添加图片" data-icon="image"></button></div><div id="editorExpandWrap" class="editor-expand-wrap" data-mode="expand" hidden><svg class="editor-expand-arc" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M9 1C12.3 1 15 3.7 15 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><button id="editorExpandBtn" class="editor-expand-btn" type="button" aria-label="展开编辑区" title="展开编辑区"><svg class="detach-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><rect x="7" y="7" width="5.5" height="4.5" rx="1"/></svg><svg class="expand-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 2.5H13.5V6.5M6.5 13.5H2.5V9.5M13.5 2.5 9 7M2.5 13.5 7 9"/></svg><svg class="collapse-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 6.5H9.5V2.5M2.5 9.5H6.5V13.5M9.5 6.5 13.5 2.5M6.5 9.5 2.5 13.5"/></svg></button></div><div class="composer-bottom"><div class="format-tools"><button id="insertTag" title="添加标签" aria-label="添加标签">#</button><button data-format="list" title="无序列表" aria-label="无序列表" data-icon="list"></button><button data-format="number" title="有序列表" aria-label="有序列表" data-icon="ordered"></button><button data-format="quote" title="引用" aria-label="引用" data-icon="quote"></button><button id="addAudio" hidden title="添加语音" aria-label="添加语音"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.5" y="1.5" width="5" height="8" rx="2.5"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5M5.5 14.5h5"/></svg></button><button id="addImage" title="添加图片" aria-label="添加图片" data-icon="image"></button><input id="imageInput" type="file" accept="image/*" multiple hidden></div><div class="send-wrap"><span id="charCount"></span><button id="cancelCompose" class="cancel-compose" title="清空当前输入">取消</button><button id="cancelEdit" hidden>取消编辑</button><button id="saveMemo" class="send" aria-label="保存笔记" title="保存笔记（Shift / Ctrl + Enter）" disabled><span data-icon="send"></span><span id="saveMemoLabel">保存笔记</span></button></div></div><div class="save-status-row" id="saveStatusRow"><span id="draftStatus" role="status" aria-live="polite" class="draft-status" data-state="idle"></span><button id="retryDraft" hidden>重试草稿备份</button><span id="noteStatus" role="status" aria-live="polite" data-state="idle"></span><button id="retrySaveMemo" type="button" hidden>重试保存</button></div><div id="tagSuggestions" class="tag-suggestions" hidden></div></section>
    <div id="searchResultsStatus" class="search-results-status" role="status" aria-live="polite" hidden></div><div id="filterBar" class="filter-bar" hidden></div><div id="filterPopover" class="filter-popover" role="dialog" aria-label="筛选条件" hidden></div><div id="filterCalendar" class="filter-calendar" role="dialog" aria-label="选择日期" hidden></div>
    <div class="list-heading"><span id="listSubtitle"></span><span class="list-order">按时间排列</span></div>
    <section id="specialPanel"></section><div id="bootStatus" class="boot-status" role="status" aria-live="polite">正在加载笔记…</div><section id="memos" class="memo-list" aria-label="笔记列表"></section>
    <footer class="main-footer" hidden><span class="footer-logo">Fomo</span><span>持续不断记录，意义自然浮现</span><small>独立复刻版 · 数据保存在当前浏览器</small></footer>
  </main>
  <aside id="insights" class="insights" aria-label="记录概览">
    <div class="insights-title"><h2>记录概览</h2><button id="collapseInsights" aria-label="收起记录概览" title="收起概览" data-icon="close"></button></div>
    <section class="insight-panel"><div class="panel-heading"><h3>最近七天</h3><span id="weekRange"></span></div><div class="week-total"><strong id="weekTotal">0</strong><span>条笔记</span><small id="todayTotal">今天 0 条</small></div><div id="weekChart" class="week-chart" aria-label="最近七天记录数量"></div><div class="panel-foot"><span>一点一滴，积累成形。</span><span id="weekDays">0 天有记录</span></div></section>
    <section class="insight-panel activity-panel"><div class="panel-heading"><h3>记录足迹</h3><span>近 12 周</span></div>
    <div class="heat-wrap"><div class="day-labels"><span>一</span><span>三</span><span>五</span></div><div id="heatmap" class="heatmap" aria-label="记录热力图"></div></div>
    <div class="heat-top"><span id="heatMonth" class="heat-month"></span><button id="calendarReset" class="calendar-reset" title="查看全部记录" aria-label="清除日期筛选">全部</button></div>
    <div class="heat-legend"><span>少</span><i></i><i></i><i></i><i></i><i></i><span>多</span></div>
    <div class="activity-legend"><span>少</span><i></i><i></i><i></i><i></i><i></i><span>多</span></div></section>
    <section class="insight-panel"><div class="panel-heading"><h3>常用标签</h3><span id="usedTagCount">0 个</span></div><div id="frequentTags" class="frequent-tags"></div></section>
    <section class="shortcut-panel"><h3>留一点空间，给想法。</h3><p>不必完整，不必有结论。<br>先记下来，之后再慢慢整理。</p><dl><div><dt>搜索笔记</dt><dd><kbd>Ctrl K</kbd></dd></div><div><dt>保存记录</dt><dd><kbd>Ctrl ↵</kbd></dd></div><div class="shortcut-native"><dt>唤起窗口</dt><dd><kbd>Ctrl Alt N</kbd></dd></div></dl></section>
    <div class="insights-footer"><span class="small-brand">Fomo</span><span>记录 / 连接 / 回顾</span></div>
  </aside>
</div>
<div id="tagMenu" class="tag-menu" role="menu" popover="auto" aria-label="标签操作"></div>
<div id="mobileOverlay" class="mobile-overlay" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<dialog id="dialog" aria-labelledby="dialogTitle"><div class="dialog-header"><h2 id="dialogTitle"></h2><button id="closeDialog" aria-label="关闭" data-icon="close"></button></div><div id="dialogBody"></div></dialog>

<input id="importInput" type="file" accept=".json" hidden><script src="icons.js"></script><script src="classic.js"></script><script src="core.js"></script><script src="markup.js"></script><script src="editor.js"></script><script src="interactions.js"></script><script src="store.js"></script><script src="tag-sidebar.js"></script><script src="export.js"></script><script src="app.js"></script>
