<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fomo · 浮窗</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;overflow:hidden;font-family:"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",sans-serif;color:#2e2e2e}
button{font:inherit;cursor:pointer}
#collapsed{position:absolute;right:0;bottom:0;width:56px;height:56px;display:grid;place-items:center}
#expand{width:44px;height:44px;border:1px solid #e6e6e6;border-radius:12px;background:#fff;box-shadow:0 5px 18px #0002;display:grid;place-items:center;gap:4px;align-content:center}
#expand i{display:block;width:18px;height:2px;border-radius:2px;background:#18c964}
#panel{position:absolute;inset:8px;background:#fff;border:1px solid #ececec;border-radius:14px;box-shadow:0 16px 36px #0002;overflow:hidden;display:flex;flex-direction:column}
#panel[hidden]{display:none}
header{height:48px;min-height:48px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#count{font-size:13px;color:#777;white-space:nowrap}
header nav{display:flex;align-items:center;gap:14px}
header nav button{border:0;background:transparent;color:#777;font-size:12px;padding:3px 0;white-space:nowrap}
header nav button:hover{color:#1db954}
#cards{flex:1;min-height:0;overflow:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:8px}
.card{position:relative;border:1px solid #eee;border-radius:11px;background:#fff;padding:13px 34px 13px 14px;min-height:74px;cursor:pointer;box-shadow:0 2px 8px #00000008;flex:0 0 auto}
.card:hover{background:#fafafa}
.card .tag{color:#365f40;background:#e5f2e7;font-size:13px;line-height:1.6;padding:2px 4px;border-radius:8px;margin-right:3px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.card .tag:empty{display:none}
.card .line{font-size:13px;line-height:1.65;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card .text{font-size:13px;line-height:1.65}
.card .remove{position:absolute;right:8px;top:9px;width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:#aaa;font-size:16px;line-height:1}
.card .remove:hover{background:#eee;color:#555}
#empty{color:#999;font-size:12px;text-align:center;padding:30px 0}
#status{height:20px;min-height:20px;padding:0 14px;color:#999;font-size:11px;overflow:hidden}
</style><style>html,body,body *{scrollbar-width:none!important;scrollbar-gutter:auto!important}html::-webkit-scrollbar,body::-webkit-scrollbar,body *::-webkit-scrollbar{display:none!important;width:0!important;height:0!important}</style></head>
<body><div id="collapsed"><button id="expand" aria-label="展开浮窗" title="展开浮窗"><i></i><i></i><i></i></button></div><section id="panel" hidden><header><span id="count"></span><nav><button id="undo" hidden>撤销</button><button id="copy">复制全部</button><button id="clear">清空</button></nav></header><div id="cards"></div><p id="status"></p></section><script src="float.js"></script></body></html>
